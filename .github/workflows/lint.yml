name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:

jobs:
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run ty type checking
        run: ty check
      - name: Run ruff
        run: |
          uv ruff check src/ tests/
          uv ruff format --check src/ tests/
      - name: Run bandit security checking
        run: uv bandit -c ./bandit.yaml -r src
